[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'
[project]
name = 'wdc-pharma-next'
version = '1.0.0-pre.1'
requires-python = '>=3.11'
dependencies = ['fastapi>=0.110,<1', 'uvicorn>=0.27,<1']
[project.optional-dependencies]
test = ['pytest>=8,<10', 'httpx>=0.27,<1']
[project.scripts]
pharma-next = "pharma_next.main:application"
[tool.setuptools.packages.find]
include = ['pharma_next*']
