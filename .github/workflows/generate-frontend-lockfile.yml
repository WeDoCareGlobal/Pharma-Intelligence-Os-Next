name: Generate frontend npm lockfile artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/generate-frontend-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/frontend-ci-paths-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate reproducible npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify generated lockfile
        working-directory: frontend
        run: node -e "const p=require('./package-lock.json'); if(p.lockfileVersion < 3 || p.name !== require('./package.json').name) process.exit(1)"
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: pharma-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
      - name: Commit generated lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit npm-generated frontend dependency lockfile"
            git push origin HEAD:refs/heads/fix/frontend-ci-paths-20261028
          fi
