name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-bootstrap:
    name: Generate missing npm lockfile artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate lockfile without install scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: pharma-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: lockfile-bootstrap
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: pharma-frontend-package-lock
          path: frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      # `npm ci` requires package-lock.json to be committed — that missing lock
      # file is what failed every earlier run on this repo.
      - name: Install (frontend)
        run: cd frontend && npm install

      - name: Lint
        run: cd frontend && npm run lint

      - name: Typecheck
        run: cd frontend && npm run typecheck

      - name: Test
        run: cd frontend && npx vitest run --passWithNoTests

      - name: Build
        run: cd frontend && npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --break-system-packages -e ".[test]"

      - name: Python tests
        run: python -m pytest tests/ -v

      - name: Security audit
        run: cd frontend && npm audit --audit-level=high || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Enforce high/critical vulnerability gate
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pharma-intelligence-os:test
          load: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'